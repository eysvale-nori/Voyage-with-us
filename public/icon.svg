<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Ocean Waves -->
  <path d="M0 420 C 90 390, 160 450, 256 420 C 352 390, 420 450, 512 420 L 512 512 L 0 512 Z" fill="#0ea5e9" opacity="0.4"/>
  <path d="M0 450 C 120 420, 200 480, 256 460 C 320 440, 400 480, 512 450 L 512 512 L 0 512 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Golden 8-ray Philippine Sun -->
  <circle cx="256" cy="160" r="50" fill="url(#sunGrad)"/>
  <g stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="100"/>
    <line x1="256" y1="220" x2="256" y2="240"/>
    <line x1="176" y1="160" x2="196" y2="160"/>
    <line x1="316" y1="160" x2="336" y2="160"/>
    <line x1="200" y1="104" x2="214" y2="118"/>
    <line x1="298" y1="202" x2="312" y2="216"/>
    <line x1="200" y1="216" x2="214" y2="202"/>
    <line x1="298" y1="118" x2="312" y2="104"/>
  </g>

  <!-- Big Map Pin -->
  <path d="M256 180 C206 180 166 220 166 270 C166 335 256 440 256 440 C256 440 346 335 346 270 C346 220 306 180 256 180 Z" fill="url(#pinGrad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
  <circle cx="256" cy="265" r="34" fill="#ffffff"/>
  
  <!-- Philippine 3 Golden Stars inside the pin -->
  <polygon points="256,248 260,258 271,259 263,267 265,278 256,272 247,278 249,267 241,259 252,258" fill="#f59e0b"/>
</svg>
